[project]
name = "secrets-agent"
version = "0.1.0"
description = "MCP server that creates and searches OpenBao secrets as the signed-in user (Edward's AI Hub)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]

[project.scripts]
secrets-mcp = "secrets_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: touches the hub's OpenBao (ask first)"]
addopts = "-m 'not live'"
